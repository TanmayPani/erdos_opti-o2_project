# Formalizing Dissolved-Oxygen<br>Event Classification

#### A transitioning coastal wetland — Beaver Creek, WA

<span class="small">Erdős Institute Data Science Bootcamp · Industry partner: **Opti O2, LLC**<br>Tanmay Pani · Eric Britt</span>

</div>

Note: We turned an expert hand-labeling process into an automated, interpretable, validated classifier — and shipped it even though the labeled data never arrived.


---

## The problem

Opti O2 measures subsurface dissolved oxygen at **5-min cadence for six years** in a floodplain turning into a tidal wetland after culvert removal.

Against a near-permanently anoxic baseline, oxygen arrives in discrete **events** that experts sort into two classes:

- 🌊 **Hot moments** — abrupt, *asymmetric* rises; tidal seawater incursion (salinity / water-level **step**).
- 🌧️ **Oxic pulses** — *symmetric* rise-and-fall; follow **precipitation**.

**Goal:** formalize this manual taxonomy into a reproducible, interpretable, validated classifier.


---

## The wrinkle

<div class="center" style="margin-top:0.5em">

### The expert-labeled dataset is under NDA — and hasn't been delivered.

</div>

We have only the **public ESS-DIVE stand-in** from the same site (~554k rows). **No labels.**

> So the deliverable becomes: *build and validate the entire pipeline anyway — and make it flip to the real labels in one line.*


---

## What we built (on the stand-in)

| Notebook | Role |
|---|---|
| **exploratory.py** | EDA · event detection (~102) · shape + antecedent features · **weak-supervision labels** |
| **modeling.py** | **Dual-track classifier** — boosting + deep learning, one leakage-checked CV harness |
| **discovery.py** | **Unsupervised driver discovery** — label-free corroboration + drift |

<span class="small">`exploratory.py → derived/*.parquet → modeling.py + discovery.py` · full rerun ≈ **26 s**.</span>


---

## Physics-grounded labels (not circular)

Instead of circular k-means clusters, we encode the **published taxonomy** as **labeling functions**:

- curve symmetry (`peak_frac`, `centroid_frac`) + abrupt onset → **hot**
- salinity / water-level **step**, DO–salinity hysteresis → **hot**
- antecedent 24 h **precipitation** → **pulse**

A transparent accuracy-weighted **label model** aggregates the noisy votes → `ws_label` (61 hot / 41 pulse).

> One switch — `LABEL_COL` — points the whole pipeline at this, or at the real expert column later.


---

## Results — stand-in (weak-supervision) labels

| model | macro-F1 | Cohen's κ | ROC-AUC |
|---|---|---|---|
| XGBoost | 0.92 ± 0.05 | 0.85 | 0.985 |
| CatBoost | 0.94 ± 0.05 | 0.87 | 0.985 |
| Logistic (L2) | **0.95 ± 0.06** | **0.90** | 0.989 |
| <span class="hl">shuffled-label control</span> | <span class="hl">0.51</span> | ≈0 | ≈0.5 |

<span class="ok">KPI #2 (macro-F1 ≥ 0.85) and KPI #3 (κ ≥ 0.80) — met.</span> Shuffled → chance proves the harness is leakage-free.


---

## Honesty slide

- **Track A is *partly* circular** — the labeling functions read some features the boosting models train on. ⇒ read it as an **upper bound**.
- **Track B** (ROCKET / SSL / InceptionTime / transformer) learns from the **raw 5-min shape, no hand features** — the **fairer test**, so we lead with it.
- **Shuffled labels → 0.51 macro-F1** — no information leaks through the CV harness.

> The point isn't "we hit 0.9" — it's a calibrated, leakage-checked pipeline that's honest about what the stand-in can and can't prove.


---

## Unsupervised corroboration (no labels)

Cluster the events with **no labels**, score against `ws_label` (ARI; chance = 0):

| feature space | k-means | Ward |
|---|---|---|
| all 22 features | ≈ 0.00 | ≈ 0.00 |
| **shape + driver subspace** | **0.68** | **0.64** |

The split is invisible in the full geometry but **emerges on its own** in exactly the physics axes the rules use — independent corroboration, not an artifact. Top mutual-information drivers = symmetry shape + salinity/water-level step.

Note: This is genuinely stronger evidence than a single supervised number, because the unsupervised methods were never shown the labels.


---

## The one-line guarantee

<div class="center" style="margin-top:0.4em">

```python
# modeling.py
LABEL_COL = "ws_label"   # ← flip to the real expert column on NDA delivery
```

</div>

Everything downstream — features, both tracks, CV, metrics, the discovery analysis — **re-runs unchanged in < 1 min**.

> This plan is a strict **superset** of the original: every result becomes a *genuine* expert-label result the moment the data lands.
