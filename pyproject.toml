[project]
name = "opti-o2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "core",
    "catboost>=1.2.10",
    "fastexcel>=0.20.2",
    "numpy>=2.0",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "tabpfn>=8.0.8",
    "tabpfn-client>=0.3.2",
    "torch>=2.12.0",
    "xgboost>=3.2.0",
    "skorch>=1.4.0",
    "tabpfn-extensions[interpretability]>=0.4.2",
    "numba>=0.61.0,<0.63",
    "ipython>=9.15.0",
    "pre-commit>=4.6.2",
]

[dependency-groups]
dev = [
    "marimo[recommended]>=0.23.8",
    "mcp>=1.27.2",
    "ty-extensions>=0.1.0",
    "anthropic[mcp]>=0.109.1",
    "google-genai[aiohttp,local-tokenizer]>=2.8.0",
    "python-lsp-ruff>=2.3.1",
    "python-lsp-server>=1.14.0",
    "ty>=0.0.49",
    "websockets>=16.0",
    "nbconvert>=7.17.1",
    "playwright>=1.61.0",
    "vl-convert-python>=1.9.0.post1",
]

[tool.uv.sources]
core = { workspace = true }

[tool.uv.workspace]
members = [
    "core",
]

[tool.ruff]
# This tells Ruff to treat this directory as first-party code
src = ["core/src"]

[tool.marimo.runtime]
output_max_bytes = 20_000_000
